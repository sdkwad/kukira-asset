name: Bina APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.27.4
          cache: true

      - name: Jana folder android dari templat Flutter
        run: |
          flutter create --platforms=android --org app.kukira --project-name kukira_asset /tmp/gen
          rm -rf android
          cp -r /tmp/gen/android ./android
          python3 tool/patch_android.py

      - name: Pakej
        run: flutter pub get

      - name: Jana kod pangkalan data (drift)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Semak kod
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Ujian
        run: flutter test

      - name: Bina APK
        run: flutter build apk --release

      - name: Namakan APK dan semak kebenaran
        run: |
          V=$(grep '^version:' pubspec.yaml | awk '{print $2}' | tr '+' '-')
          OUT="kukira-asset-$V-${GITHUB_SHA::7}.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "$OUT"
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          echo "Kebenaran dalam APK:"
          "$BT/aapt2" dump permissions "$OUT" || true
          if "$BT/aapt2" dump permissions "$OUT" | grep -q 'android.permission.INTERNET'; then
            echo "::error::APK meminta kebenaran INTERNET. Kukira mesti berfungsi tanpa rangkaian."
            exit 1
          fi
          ls -la "$OUT"

      - uses: actions/upload-artifact@v4
        with:
          name: kukira-asset-apk
          path: kukira-asset-*.apk
          retention-days: 30
