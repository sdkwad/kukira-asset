name: Bina APK

on:
  push:
    branches: ['**']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.27.4
          cache: true

      - name: Jana folder android dari templat Flutter
        run: |
          flutter create --platforms=android --org app.kukira --project-name kukira_asset /tmp/gen
          rm -rf android
          cp -r /tmp/gen/android ./android
          python3 tool/patch_android.py

      - name: Pakej
        run: flutter pub get

      - name: Jana kod pangkalan data (drift)
        timeout-minutes: 10
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Semak kod
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Ujian
        run: |
          # Database tests run on the host and need the system SQLite library.
          sudo apt-get install -y -qq libsqlite3-dev > /dev/null
          flutter test

      # The release key lives only in GitHub secrets and the owner's offline copy.
      - name: Kunci tandatangan
        env:
          KEYSTORE_B64: ${{ secrets.KUKIRA_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KUKIRA_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::Secret KUKIRA_KEYSTORE_B64 atau KUKIRA_KEYSTORE_PASSWORD tiada. Lihat README, bahagian Kunci tandatangan."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > android/app/kukira-release.p12

      # One APK per processor type keeps each file small. Most phones need arm64-v8a.
      - name: Bina APK
        env:
          KUKIRA_KEYSTORE_PASSWORD: ${{ secrets.KUKIRA_KEYSTORE_PASSWORD }}
        run: flutter build apk --release --split-per-abi

      - name: Namakan APK dan semak kebenaran
        run: |
          V=$(grep '^version:' pubspec.yaml | awk '{print $2}' | tr '+' '-')
          S=${GITHUB_SHA::7}
          for abi in arm64-v8a armeabi-v7a x86_64; do
            cp "build/app/outputs/flutter-apk/app-$abi-release.apk" "kukira-asset-$V-$S-$abi.apk"
          done
          OUT="kukira-asset-$V-$S-arm64-v8a.apk"
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          echo "Kebenaran dalam APK:"
          "$BT/aapt2" dump permissions "$OUT" || true
          for bad in INTERNET READ_EXTERNAL_STORAGE REQUEST_INSTALL_PACKAGES CAMERA; do
            if "$BT/aapt2" dump permissions "$OUT" | grep -q "android.permission.$bad'"; then
              echo "::error::APK meminta kebenaran $bad yang tidak sepatutnya ada."
              exit 1
            fi
          done
          # Every APK must carry the Kukira release certificate, or it cannot update an installed copy.
          RELEASE_CERT=da88ed128e672ee6ceb9df3bc3174bad12ebcbdc245556735429afdf5e546754
          for apk in kukira-asset-*.apk; do
            if ! "$BT/apksigner" verify --print-certs "$apk" | grep -q "SHA-256 digest: $RELEASE_CERT"; then
              echo "::error::$apk tidak ditandatangani dengan kunci keluaran Kukira."
              exit 1
            fi
          done
          rm -f android/app/kukira-release.p12
          ls -la kukira-asset-*.apk

      - uses: actions/upload-artifact@v5
        with:
          name: kukira-asset-apk
          path: kukira-asset-*.apk
          retention-days: 30
